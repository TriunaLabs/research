name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy psutil pytest
      - name: Run benchmark test suite (tiny corpus, ~40 MB)
        working-directory: articles/ai-native-ssd/benchmark
        run: python -m pytest tests/ -v
