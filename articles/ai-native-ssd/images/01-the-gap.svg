<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#fcfcfb"/>

  <text x="60" y="66" font-size="31" font-weight="700" fill="#0b0b0b">The fastest place to compute is not the cheapest place to keep data.</text>
  <text x="60" y="98" font-size="17" fill="#52514e">Fastest AI memory vs. densest AI storage, 2026: shipping hardware, vendor-listed figures</text>

  <!-- Left card: GPU HBM -->
  <rect x="60" y="140" width="480" height="360" rx="14" fill="#ffffff" stroke="#e1e0d9"/>
  <rect x="60" y="140" width="480" height="8" rx="4" fill="#2a78d6"/>
  <text x="90" y="196" font-size="15" font-weight="600" fill="#898781" letter-spacing="1">GPU MEMORY</text>
  <text x="90" y="224" font-size="19" font-weight="600" fill="#0b0b0b">NVIDIA B200 (HBM3e)</text>

  <text x="90" y="316" font-size="64" font-weight="700" fill="#0b0b0b">8 TB/s</text>
  <text x="90" y="348" font-size="17" fill="#52514e">memory bandwidth</text>

  <text x="90" y="428" font-size="34" font-weight="700" fill="#52514e">180 GB</text>
  <text x="90" y="456" font-size="16" fill="#898781">capacity per GPU</text>

  <!-- Right card: SSD -->
  <rect x="660" y="140" width="480" height="360" rx="14" fill="#ffffff" stroke="#e1e0d9"/>
  <rect x="660" y="140" width="480" height="8" rx="4" fill="#eb6834"/>
  <text x="690" y="196" font-size="15" font-weight="600" fill="#898781" letter-spacing="1">FLASH STORAGE</text>
  <text x="690" y="224" font-size="19" font-weight="600" fill="#0b0b0b">Micron 6600 ION, one drive</text>

  <text x="690" y="316" font-size="64" font-weight="700" fill="#0b0b0b">245.76 TB</text>
  <text x="690" y="348" font-size="17" fill="#52514e">capacity per drive</text>

  <text x="690" y="428" font-size="34" font-weight="700" fill="#52514e">13.7 GB/s</text>
  <text x="690" y="456" font-size="16" fill="#898781">sequential read (PCIe Gen5)</text>

  <!-- Center ratio chips -->
  <line x1="600" y1="160" x2="600" y2="480" stroke="#e1e0d9"/>
  <rect x="522" y="244" width="156" height="52" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="600" y="265" font-size="11.5" font-weight="600" fill="#898781" text-anchor="middle" letter-spacing="1">BANDWIDTH</text>
  <text x="600" y="286" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">HBM: 580&#215; faster</text>
  <rect x="522" y="374" width="156" height="52" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="600" y="395" font-size="11.5" font-weight="600" fill="#898781" text-anchor="middle" letter-spacing="1">CAPACITY</text>
  <text x="600" y="416" font-size="16" font-weight="700" fill="#eb6834" text-anchor="middle">SSD: 1,365&#215; bigger</text>

  <text x="600" y="560" font-size="23" font-weight="600" fill="#0b0b0b" text-anchor="middle">AI architecture increasingly lives in the gap.</text>

  <text x="60" y="608" font-size="12.5" fill="#898781">Sources: NVIDIA HGX B200 documentation; Micron 6600 ION specifications</text>
  <text x="1140" y="608" font-size="12.5" fill="#898781" text-anchor="end">Triuna Labs Research &#183; triunalabs.com</text>
</svg>
