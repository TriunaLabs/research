<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#fcfcfb"/>
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="none" stroke="#898781" stroke-width="2"/>
    </marker>
    <marker id="rt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <text x="600" y="56" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">Different planes. Same problem.</text>
  <text x="600" y="86" font-size="16.5" fill="#52514e" text-anchor="middle">Two unrelated workloads, each discarding almost everything before it pays to move anything</text>

  <line x1="600" y1="120" x2="600" y2="470" stroke="#e1e0d9"/>

  <!-- ============ LEFT: RETRIEVAL ============ -->
  <text x="315" y="140" font-size="13.5" font-weight="700" fill="#2a78d6" text-anchor="middle" letter-spacing="1.5">RETRIEVAL PLANE</text>
  <text x="315" y="160" font-size="12.5" fill="#898781" text-anchor="middle">measured: Triuna Labs benchmark</text>

  <rect x="85" y="178" width="460" height="60" rx="8" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6"/>
  <text x="315" y="205" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">102.4 GB</text>
  <text x="315" y="226" font-size="13" fill="#52514e" text-anchor="middle">embedding corpus resident on disk</text>

  <line x1="315" y1="242" x2="315" y2="278" stroke="#898781" stroke-width="1.5" marker-end="url(#dn)"/>
  <text x="330" y="266" font-size="12.5" fill="#52514e">IVF index selects 8 of 1,024 clusters</text>

  <rect x="170" y="288" width="290" height="60" rx="8" fill="#2a78d6" fill-opacity="0.22" stroke="#2a78d6"/>
  <text x="315" y="315" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">0.80 GB</text>
  <text x="315" y="336" font-size="13" fill="#52514e" text-anchor="middle">crosses to the host: <tspan font-weight="700">0.8%</tspan></text>

  <line x1="315" y1="352" x2="315" y2="388" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#dn)"/>
  <text x="330" y="376" font-size="12.5" fill="#898781">proposed: score inside the device</text>

  <rect x="245" y="398" width="140" height="54" rx="8" fill="#2a78d6" fill-opacity="0.32" stroke="#2a78d6" stroke-dasharray="4 3"/>
  <text x="315" y="422" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">331 KB</text>
  <text x="315" y="441" font-size="12" fill="#52514e" text-anchor="middle">protocol traffic</text>

  <!-- ============ RIGHT: WEIGHTS ============ -->
  <text x="885" y="140" font-size="13.5" font-weight="700" fill="#eb6834" text-anchor="middle" letter-spacing="1.5">WEIGHT PLANE</text>
  <text x="885" y="160" font-size="12.5" fill="#898781" text-anchor="middle">independent: Kimi K3 out-of-core inference</text>

  <rect x="655" y="178" width="460" height="60" rx="8" fill="#eb6834" fill-opacity="0.14" stroke="#eb6834"/>
  <text x="885" y="205" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">1.56 TB</text>
  <text x="885" y="226" font-size="13" fill="#52514e" text-anchor="middle">2.78-trillion-parameter checkpoint on disk</text>

  <line x1="885" y1="242" x2="885" y2="278" stroke="#898781" stroke-width="1.5" marker-end="url(#dn)"/>
  <text x="900" y="266" font-size="12.5" fill="#52514e">MoE routing selects 16 of 896 experts</text>

  <rect x="740" y="288" width="290" height="60" rx="8" fill="#eb6834" fill-opacity="0.22" stroke="#eb6834"/>
  <text x="885" y="315" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">~104 B params</text>
  <text x="885" y="336" font-size="13" fill="#52514e" text-anchor="middle">active per token: <tspan font-weight="700">under 4%</tspan></text>

  <line x1="885" y1="352" x2="885" y2="388" stroke="#898781" stroke-width="1.5" marker-end="url(#dn)"/>
  <text x="900" y="376" font-size="12.5" fill="#898781">experts streamed, never resident</text>

  <rect x="815" y="398" width="140" height="54" rx="8" fill="#eb6834" fill-opacity="0.32" stroke="#eb6834"/>
  <text x="885" y="422" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="middle">8.24 GB</text>
  <text x="885" y="441" font-size="12" fill="#52514e" text-anchor="middle">measured peak RSS</text>

  <!-- ============ SHARED PRINCIPLE ============ -->
  <rect x="60" y="482" width="1080" height="52" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
  <g font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="252" y="514">DECIDE</text>
    <text x="472" y="514">REDUCE</text>
    <text x="700" y="514">MOVE</text>
    <text x="936" y="514">COMPUTE</text>
  </g>
  <g stroke="#52514e" stroke-width="1.5" marker-end="url(#rt)">
    <line x1="300" y1="509" x2="410" y2="509"/>
    <line x1="527" y1="509" x2="645" y2="509"/>
    <line x1="742" y1="509" x2="860" y2="509"/>
  </g>

  <text x="600" y="568" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="middle">The optimisation happens before the expensive transfer.</text>

  <text x="60" y="608" font-size="12" fill="#898781">Left: measured on a consumer laptop; scripts and raw results at github.com/TriunaLabs/research. Right: kimi-k3-in-c, an independent C99 implementation of Moonshot AI&#8217;s Kimi K3.</text>
  <text x="1140" y="608" font-size="12" fill="#898781" text-anchor="end">Triuna Labs Research</text>
</svg>
